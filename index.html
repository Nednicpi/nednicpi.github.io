<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VQI GLOBAL - TICKET CHAIN QUANTUM V13</title>
<style>
body{background:#0a0a0a;color:#0f0;font-family:monospace;padding:10px;margin:0}
.card{background:#111;border:1px solid #0f0;border-radius:12px;padding:12px;margin:10px 0}
button{background:#0f0;color:#000;font-weight:bold;padding:15px;width:100%;border:none;border-radius:10px;font-size:16px;cursor:pointer}
button:disabled{background:#444;color:#888}
#dailyTimer{background:#000;border:2px solid #0f0;padding:12px;text-align:center;font-weight:bold;border-radius:10px;margin:10px 0;font-size:14px}
.small{font-size:10px;color:#888;text-align:center}
</style>
<script>
// === VQI MINING LIMIT 10 MENIT/HARI - PLAYSTORE COMPLIANT ===
const DAILY_LIMIT = 10*60*1000;
let todayStr=new Date().toDateString();
let lastDay=localStorage.getItem('vqi_day');
let usedToday=parseInt(localStorage.getItem('vqi_used')||'0');
let blocksToday=parseInt(localStorage.getItem('vqi_blocks_today')||'0');
if(lastDay!==todayStr){
  localStorage.setItem('vqi_day',todayStr);
  localStorage.setItem('vqi_used','0');
  localStorage.setItem('vqi_blocks_today','0');
  usedToday=0;blocksToday=0;
}
let mineStart=null,mineTimer=null;
function updateTimerUI(){
  let total=usedToday+(mineStart?Date.now()-mineStart:0);
  let sisa=DAILY_LIMIT-total;
  if(sisa<0)sisa=0;
  let m=Math.floor(sisa/60000),s=Math.floor(sisa%60000/1000);
  let el=document.getElementById('dailyTimer');
  if(el)el.innerHTML=`⏱️ Sisa Mining Hari Ini: ${m}:${String(s).padStart(2,'0')} / 10:00 | Blok Hari Ini: ${blocksToday} | Play Store Compliant`;
  if(sisa<=0){
    stopDailyMining();
    let btn=document.getElementById('mineBtn');
    if(btn){btn.disabled=true;btn.innerText='❌ LIMIT 10 MENIT HABIS - BESOK LAGI';}
  }
}
function startDailyMining(){
  if(usedToday>=DAILY_LIMIT){alert('⛔ Jatah 10 menit hari ini habis! Besok reset jam 00:00');return false;}
  mineStart=Date.now();mineTimer=setInterval(updateTimerUI,1000);return true;
}
function stopDailyMining(){
  if(mineStart){usedToday+=Date.now()-mineStart;localStorage.setItem('vqi_used',usedToday.toString());clearInterval(mineTimer);mineStart=null;}
}
function onBlockFound(){
  blocksToday++;localStorage.setItem('vqi_blocks_today',blocksToday.toString());stopDailyMining();updateTimerUI();
}
setTimeout(updateTimerUI,500);
</script>
</head><body>
<h2 style="text-align:center">🎟️ TIKET CHAIN QUANTUM V13</h2>
<div class="card">
<div>VQI GLOBAL - Quantum Mining</div>
<div id="dailyTimer">⏱️ Sisa Mining Hari Ini: 10:00 / 10:00 | Blok Hari Ini: 0</div>
<div style="margin:10px 0">Diff: <span id="diff">4</span> | H: <span id="hashes">0</span> | H/s: <span id="hps">0</span></div>
<button id="mineBtn" onclick="if(startDailyMining()){mineOneBlock();}">✅ BLOCK 283! MINE 284</button>
<p class="small">Google Play Developer Policy Compliant: Mining limited to 10 min/day, user-initiated only, no background mining. Mining stops automatically after limit.</p>
</div>
<div class="card" id="chain"></div>
<script>
// === SIMULASI MINING LAMA KAMU - DITAMBAH LIMIT ===
let blockNum=283;
let hashes=0;
function mineOneBlock(){
  let start=Date.now();
  let hashCount=0;
  // simulasi mining cepat (tetap bisa 20-40 blok dalam 10 menit)
  let interval=setInterval(()=>{
    hashCount+=Math.floor(Math.random()*5000);
    hashes+=5000;
    document.getElementById('hashes').innerText=hashes;
    if(Math.random()>0.95){ // 5% chance dapet blok tiap tick
      clearInterval(interval);
      blockNum++;
      onBlockFound();
      document.getElementById('chain').innerHTML+=`<div>✅ Block ${blockNum} mined! - ${new Date().toLocaleTimeString()} - Hash: 0000${Math.random().toString(16).substr(2,8)}</div>`;
      document.getElementById('mineBtn').innerText=`✅ BLOCK ${blockNum}! MINE ${blockNum+1}`;
      // cek apakah masih ada sisa waktu untuk lanjut auto
      let sisa=DAILY_LIMIT-(usedToday+(mineStart?Date.now()-mineStart:0));
      if(sisa>0 && confirm(`Block ${blockNum} dapet! Lanjut mining? Sisa ${(sisa/60000).toFixed(1)} menit`)){
        if(startDailyMining()) mineOneBlock();
      }
    }
    if(Date.now()-start>5000){clearInterval(interval); stopDailyMining();}
  },200);
}
</script>
</body></html>
