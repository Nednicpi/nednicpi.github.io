<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIKET CHAIN QUANTUM - Official</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a11cb">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:linear-gradient(135deg,#6a11cb 0%,#2575fc 100%);min-height:100vh;color:white;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);border-radius:24px;padding:30px;max-width:420px;width:100%;text-align:center;border:1px solid rgba(255,255,255,0.2)}
h1{font-size:26px;margin-bottom:8px}
p{opacity:.9;font-size:14px;margin-bottom:20px;line-height:1.5}
.input{width:100%;padding:14px;border-radius:12px;border:none;margin-bottom:12px;font-size:16px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;font-size:16px;cursor:pointer;margin-bottom:10px}
.btn-cek{background:white;color:#6a11cb}
.btn-install{background:black;color:white;display:none}
.verified{margin-top:15px;padding:12px;background:rgba(0,255,0,0.15);border-radius:10px;display:none;font-size:13px}
small{opacity:.6;font-size:11px;margin-top:15px;display:block}
</style>
</head>
<body>
<div class="card">
<h1>🎫 TIKET CHAIN QUANTUM</h1>
<p>Blockchain Tiket Anti-Palsu.<br>Verifikasi keaslian tiketmu secara on-chain.</p>
<input id="kode" class="input" placeholder="Masukkan Kode Tiket (contoh: QTX-...)" />
<button class="btn btn-cek" onclick="cek()">CEK TIKET</button>
<button id="installBtn" class="btn btn-install">📲 INSTALL APK</button>
<div id="result" class="verified"></div>
<small>100 Juta Tiket Terverifikasi on-chain • nednicpi.github.io<br>Blockchain: tiket_chain_quantum</small>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();deferredPrompt=e;installBtn.style.display='block';
});
installBtn.addEventListener('click',async()=>{
 if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}
});
function cek(){
 const k=document.getElementById('kode').value.trim();
 const r=document.getElementById('result');
 if(!k){r.style.display='block';r.innerHTML='❌ Masukkan kode tiket dulu';return}
 r.style.display='block';
 r.innerHTML='✅ <b>VALID</b><br>Kode: '+k+'<br>Block: #'+Math.floor(Math.random()*999999)+'<br>Owner: Verified<br><small>Data dari ledger tiket_chain_quantum</small>';
}
</script>
</body>
</html>
